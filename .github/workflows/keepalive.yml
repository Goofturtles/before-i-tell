# Keeps the Render free-tier relay from spinning down (it sleeps after ~15
# idle minutes and takes up to a minute to wake — which made every first
# "Send" after a quiet spell feel broken). A ping every 10 minutes holds it
# warm. The ping carries nothing; /health returns liveness only.
#
# Cost note: this keeps the service on ~24h/day, drawing from the Render
# workspace's shared 750 free instance-hours/month. Fine through judging
# (Sep 4); delete or disable this workflow afterwards if the hours matter.
name: keep-relay-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping relay /health
        run: curl -fsS -m 30 https://bit-relay.onrender.com/health || true
