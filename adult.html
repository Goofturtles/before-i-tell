        <div class="step-head">
          <p class="eyebrow">Before I Tell · For the adult</p>
          <h1 class="head-md">Someone is about to tell you something hard.</h1>
          <p class="lead">This page helps the conversation go well. It takes two minutes to read.</p>
        </div>
        <section class="brief-section">
          <h2 class="head-sm">How to receive what you're about to hear</h2>
          <ol class="brief-steps">
            <li><span><b>Listen all the way through first.</b><p>No questions, no advice, no visible alarm — even helpful interruptions tell them to stop.</p></span></li>
            <li><span><b>Believe them.</b><p>The strongest predictor of whether a young person keeps seeking help is whether the first adult believed them.</p></span></li>
            <li><span><b>Don't promise secrecy — say what you must share, before they start.</b><p>In Ontario, every adult must report suspected abuse or neglect of anyone under 16 directly to a children's aid society — even things told "in confidence." Say this up front, plainly and kindly.</p></span></li>
            <li><span><b>Let silence happen.</b><p>If they go quiet or cry, wait. The pause is part of the telling.</p></span></li>
            <li><span><b>End with what happens next — decided together.</b><p>Name one concrete next step and when you'll check in.</p></span></li>
          </ol>
        </section>
        <section class="brief-section">
          <h2 class="head-sm">The hard case</h2>
          <div class="hard-case">
            <h3>What if they ask you not to tell anyone — and it's something you must report?</h3>
            <p>Honour every request you legally can, and be honest immediately about the one you can't: "I'm going to do everything you asked. One thing I can't do is keep this part secret — the law says I have to involve people whose whole job is protecting you. I'll tell you exactly what happens next, and I'm not going anywhere."</p>
            <p>Under Ontario's Child, Youth and Family Services Act, the duty to report is yours personally — you must call a children's aid society directly and cannot delegate it. For 16–17 year olds, reporting is permitted rather than mandatory, which gives you room to plan next steps together.</p>
            <p class="small">Source: Ontario College of Teachers, Professional Advisory on the Duty to Report; OACAS.</p>
          </div>
        </section>
        <p class="decode-note">This link may also carry the young person's specific requests — enable JavaScript to see them. Everything above applies either way.</p>
