# Render blueprint for the codename relay (lives at the REPO ROOT because
# Render's Blueprint flow only discovers render.yaml here; the service itself
# is in relay/ via rootDir).
# Deploy: New → Blueprint on render.com, pick this repo, then set the
# sync:false values in the dashboard:
#   BIT_GMAIL_USER / BIT_GMAIL_APP_PASSWORD — a DEDICATED Gmail for the relay
#     (never a personal address: counsellors see it as the sender), 2FA on,
#     App Password generated.
#   BIT_PUBLIC_URL   — this service's own URL, e.g. https://bit-relay.onrender.com
#   BIT_ALLOW_ORIGIN — https://goofturtles.github.io
services:
  - type: web
    name: bit-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: BIT_RELAY_MODE
        value: live
      - key: BIT_POLL_SECONDS
        value: "20"
      - key: BIT_RETAIN_DAYS
        value: "90"
      - key: BIT_GMAIL_USER
        sync: false
      - key: BIT_GMAIL_APP_PASSWORD
        sync: false
      - key: BIT_PUBLIC_URL
        sync: false
      - key: BIT_ALLOW_ORIGIN
        sync: false
    # NOTE ON DURABILITY — read before demoing.
    # Render's FREE plan cannot attach a disk, and its filesystem is ephemeral:
    # conversations are lost on every redeploy and on spin-down after inactivity.
    # A dropped thread also loses any counsellor reply that arrives afterwards.
    # Fine for a judged demo; NOT fine for real students.
    # To make it durable, switch `plan: free` to `plan: starter` and uncomment:
    #
    #   - key: BIT_DATA_DIR
    #     value: /var/data
    # disk:
    #   name: bit-relay-data
    #   mountPath: /var/data
    #   sizeGB: 1
