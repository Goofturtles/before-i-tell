# Render blueprint for the codename relay (lives at the REPO ROOT because
# Render's Blueprint flow only discovers render.yaml here; the service itself
# is in relay/ via rootDir).
# Deploy: New → Blueprint on render.com, pick this repo, then set the
# sync:false values in the dashboard:
#   BIT_GMAIL_USER / BIT_GMAIL_APP_PASSWORD — a DEDICATED Gmail for the relay
#     (never a personal address: counsellors see it as the sender), 2FA on,
#     App Password generated.
#   BIT_PUBLIC_URL   — this service's own URL, e.g. https://bit-relay.onrender.com
#   BIT_ALLOW_ORIGIN — https://goofturtles.github.io
services:
  - type: web
    name: bit-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: BIT_RELAY_MODE
        value: live
      - key: BIT_POLL_SECONDS
        value: "20"
      - key: BIT_RETAIN_DAYS
        value: "90"
      # REQUIRED on Render's free plan. Outbound SMTP is blocked here, so the
      # Gmail transport below cannot connect at all (it times out against
      # smtp.gmail.com:465) — that is why Level 2 silently never delivered.
      # Brevo's transactional API sends over HTTPS:443 instead, and mailer.js
      # prefers it whenever this key is present.
      - key: BIT_BREVO_API_KEY
        sync: false
      # Still needed: IMAP polling reads counsellor REPLIES from this mailbox,
      # and inbound IMAP is not blocked. The app password is also the SMTP
      # fallback for running the relay somewhere that permits SMTP.
      - key: BIT_GMAIL_USER
        sync: false
      - key: BIT_GMAIL_APP_PASSWORD
        sync: false
      - key: BIT_PUBLIC_URL
        sync: false
      - key: BIT_ALLOW_ORIGIN
        sync: false
      # Set DATABASE_URL (Render links it automatically from a Postgres
      # instance) and the relay stores conversations there instead of on the
      # container filesystem. This is what makes replies survive.
      - key: DATABASE_URL
        sync: false
    # NOTE ON DURABILITY — read before demoing.
    # The free plan's filesystem is EPHEMERAL and cannot take a disk, so with no
    # DATABASE_URL every redeploy and every spin-down erases every conversation
    # — including replies a counsellor sends afterwards. This is not theoretical:
    # it is why replies never appeared during testing.
    # With DATABASE_URL set, store.js writes to Postgres instead; verified by
    # forcing a restart and reopening the thread. /health reports which mode is
    # live: {"durable":true,"loaded":true,"lastWriteOk":true}. Check it after
    # any change here — "durable":false means back to losing conversations.
    #
    # ⚠️ Render's FREE Postgres EXPIRES 30 DAYS after creation (this one:
    # 2026-10-04) and is then deleted. Before that date either upgrade the
    # database or create a new one and relink it, or the relay silently reverts
    # to the ephemeral filesystem.
